name: Weekly Briefing (Jen)

# Sunday-evening "Plan of Attack" for the week ahead, emailed to Jen (CC Sean).
# Reads both boys' calendars + newsletters, renders the email + a one-page PDF.
# Run it by hand any time from the Actions tab (workflow_dispatch) to test.
# Tip: to test to yourself first, set a repo secret WEEKLY_TO=your@email for the
# run, then delete it so it reverts to the default (Jen, CC Sean).

on:
  schedule:
    # 23:07 UTC Sunday = 6:07 PM Central (CDT); becomes 5:07 PM Central after DST ends.
    - cron: "7 23 * * 0"
  workflow_dispatch: {}

concurrency:
  group: weekly-jen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Build and send weekly briefing
        working-directory: backend
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          WEEKLY_TO:            ${{ secrets.WEEKLY_TO }}
          WEEKLY_CC:            ${{ secrets.WEEKLY_CC }}
        run: python weekly_jen.py

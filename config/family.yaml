# Who's who, and how to tell which child an email is about.
# The parser uses `classes` to turn "email from Mrs. Reyes" into
# "this concerns Hudson".

people:
  sean:   { role: parent, calendar: Sean }
  jen:    { role: parent, calendar: Jennifer }
  hudson: { role: child,  calendar: Hudson, grade: 2, school: "New Covenant Academy" }
  reston: { role: child,  calendar: Reston, grade: 4, school: "New Covenant Academy" }

# One block per class/teacher. A message matches a child when its sender or
# body matches any `senders`/`keywords` here.
# NOTE: exact teacher/connector `senders:` addresses aren't captured yet — they
# live in the original message headers. As real forwards flow through with
# headers intact, fill these in. Keyword matching (grade + teacher name) already
# routes reliably in the meantime.
classes:
  - child: hudson              # 2nd grade
    teacher: "Mrs. Gillette"
    class_name: "2nd Grade"
    connectors: ["Jaclyn Boatright"]
    senders: []                # e.g. ["gillette@ncawarriors.org"] — capture from headers
    keywords: ["Mrs. Gillette", "Gillette", "2nd Grade", "Second Grade"]

  - child: reston              # 4th grade
    teacher: "Mrs. Flatness"
    class_name: "4th Grade"
    connectors: ["Gail Rogers"]
    senders: []                # capture from headers
    keywords: ["Mrs. Flatness", "Flatness", "4th Grade", "Fourth Grade"]

# When a message doesn't match any class above:
#   review -> hold it in the digest and ask
#   other  -> route to the Other calendar
unmatched: review

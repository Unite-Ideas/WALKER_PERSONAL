# How cautious the dashboard is, and where it reports.

ingest:
  # The self-hosted backend authenticates AS sean.michael.walker@gmail.com and
  # reads that inbox directly, where the school mail arrives — so we match on the
  # school domain, no forwarding / plus-address needed.
  query: "from:newcovenant.net newer_than:4d"
  # Messages already folded into the ledger are skipped by ID regardless.

autopost:
  # An item posts to a calendar automatically only when ALL are true:
  min_confidence: 0.80
  require_matched_person: true   # we know which child/parent it's about
  require_concrete_date: true    # a real due/event date, not "this month"
  # Anything failing these is HELD and listed in the digest for approval.

digest:
  # The digest goes to every channel listed here.
  channels:
    - type: email
      target: "sean@uniteideas.com"   # sent via Gmail connector; change if you'd
                                       # rather receive it at a personal address
    - type: slack
      target: "U0725BBE7BM"           # Sean's Slack DM (channel D071QTPNRB9)
  # When to run (local time). Phase 1 can run read-only; Phase 2 posts.
  schedule_cron: "0 6 * * *"     # 6:00 AM daily
  timezone: "America/Chicago"

resolve:
  # Two mentions are treated as the SAME item when they share a child/class,
  # overlap in theme, and their dates fall within this many days of each other.
  merge_date_window_days: 10
